; ==============================================================================
; TrashCanAI Optimized Model Router Presets for 2013 Apple Mac Pro (MacPro6,1)
; Use with: llama-server --models-preset ~/.trashcan-models.ini --models-max 1
; Each preset encodes the hardware-tuned configuration verified in docs/benchmarks.md
; NOTE: scripts/restore-trashcan.sh and scripts/serve.sh automatically rewrite
;       /home/YOUR_USER/models to your actual $HOME/models directory.
; ==============================================================================
version = 1

[*]
threads = 12
ctx-size = 4096
parallel = 1
jinja = true

[trash-fast]
; Tier 1: Quick autocomplete / instant replies (Dual D500 100% VRAM: 392.5 pp / 36.6 tg tok/s)
model = /home/YOUR_USER/models/qwen2.5-coder-1.5b-instruct-q8_0.gguf
n-gpu-layers = 99
split-mode = layer
tensor-split = 1,1
flash-attn = on

[trash-social]
; Tier 1: Spellcheck / grammar / social copy & hashtags (Dual D500 100% VRAM: 178.3 pp / 22.1 tg tok/s)
model = /home/YOUR_USER/models/qwen2.5-3b-instruct-q4_k_m.gguf
n-gpu-layers = 99
split-mode = layer
tensor-split = 1,1
flash-attn = on

[trash-code]
; Tier 2: Daily Android/Kotlin/Linux coder (100% Dual D500 28/28 layers, f16 KV + FA: 74.4 pp / 13.0 tg tok/s)
model = /home/YOUR_USER/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf
n-gpu-layers = 28
split-mode = layer
tensor-split = 1,1
flash-attn = on
load-on-startup = true

[trash-deep]
; Tier 3: Hybrid Dual-D500 + 12c Xeon THP (24/48 layers GPU: 27.6 pp / 6.40 tg tok/s)
model = /home/YOUR_USER/models/qwen2.5-coder-14b-instruct-q4_k_m.gguf
n-gpu-layers = 24
split-mode = layer
tensor-split = 1,1
flash-attn = on

[trash-heavy]
; Tier 3: 64 GB Quad-Channel ECC RAM Pure CPU Flex (zero PCIe penalty: 9.06 pp / 2.53 tg tok/s)
model = /home/YOUR_USER/models/qwen2.5-coder-32b-instruct-q4_k_m.gguf
n-gpu-layers = 0

[trash-vision]
; Multimodal Vision alt-text on Dual D500 GPUs (1.75s ViT encoding, Vicuna template)
model = /home/YOUR_USER/models/moondream2-text-model-f16.gguf
mmproj = /home/YOUR_USER/models/moondream2-mmproj-f16.gguf
n-gpu-layers = 99
split-mode = layer
tensor-split = 1,1
ctx-size = 2048
no-jinja = true
chat-template = vicuna

